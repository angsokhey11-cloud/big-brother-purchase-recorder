<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIG BROTHER — Create Purchase</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#1f2937;font-family:Inter,Arial,sans-serif}
:root{--blue:#174a91;--line:#dce4ee;--muted:#6b7280;--green:#157a51}
.page{max-width:1500px;margin:auto;padding:22px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
h1{margin:0;color:var(--blue);font-size:28px} .sub{font-size:13px;color:var(--muted);margin-top:5px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 14px #173a6610;padding:17px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
label{display:block;font-size:12px;font-weight:800;color:#475569;margin-bottom:6px}
input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:10px 11px;font:inherit;background:#fff}
textarea{min-height:72px;resize:vertical}
.section-title{font-weight:900;color:#22354d;font-size:16px;margin-bottom:12px}
.status{background:#eef4fb;border:1px solid #d9e5f3;color:#405d7d;padding:10px 12px;border-radius:8px;font-size:12px;margin-bottom:12px}
.status.success{background:#eef9f3;border-color:#c9ead9;color:#176c4a}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:950px} th,td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:12px;text-align:left}
th{background:#f8fafc;color:#475569}
td input{padding:8px}
.addline{display:grid;grid-template-columns:2fr .8fr 1fr 1fr auto;gap:9px;align-items:end;margin-bottom:12px}
button{cursor:pointer;font-weight:800;border-radius:8px;padding:10px 14px}
.primary{border:0;background:var(--blue);color:#fff} .secondary{border:1px solid var(--line);background:#fff;color:#334155} .danger{border:0;background:#fff0f0;color:#a62f2f}
.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:14px}
.summary{margin-left:auto;width:min(420px,100%);margin-top:12px}
.srow{display:flex;justify-content:space-between;gap:20px;padding:7px 0;border-bottom:1px dashed #d7dee8}
.srow.total{font-size:18px;font-weight:900;color:var(--blue);border-bottom:0}
.small{font-size:11px;color:var(--muted)}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.addline{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.grid,.addline{grid-template-columns:1fr}.page{padding:12px}}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div>
      <h1>Create Purchase</h1>
      <div class="sub">BIG BROTHER — Purchase Generator</div>
    </div>
    <button class="secondary" onclick="resetPurchase()">New Purchase</button>
  </div>

  <div class="card">
    <div class="section-title">Purchase Information</div>
    <div id="status" class="status">Select a Client / Supplier. The system will load only the products that this client sells.</div>
    <div class="grid">
      <div><label>Purchase ID</label><input id="purchaseId" readonly placeholder="Generated after Purchase Database deployment"></div>
      <div><label>Purchase Date *</label><input id="purchaseDate" type="date"></div>
      <div><label>Client / Supplier *</label><select id="client" onchange="clientChanged()"></select></div>
      <div><label>Currency</label><input id="currency" readonly value="USD"></div>

      <div><label>Client Code</label><input id="clientCode" readonly></div>
      <div><label>Payment Term</label><input id="paymentTerm" readonly></div>
      <div><label>Purchaser *</label><select id="purchaser" onchange="syncPurchaser()"></select></div>
      <div><label>Purchaser Staff ID</label><input id="purchaserId" readonly></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Products</div>

    <div class="addline">
      <div><label>Product</label><select id="product"></select></div>
      <div><label>Qty</label><input id="qty" type="number" min="0" step="0.01"></div>
      <div><label>Unit Price</label><input id="price" type="number" min="0" step="0.0001"></div>
      <div><label>Unit</label><input id="unit" readonly></div>
      <button class="primary" onclick="addItem()">+ Add</button>
    </div>

    <div class="tablewrap">
      <table>
        <thead><tr><th>No.</th><th>Product</th><th>Product Code</th><th>Qty</th><th>Unit</th><th>Unit Price</th><th>Amount</th><th></th></tr></thead>
        <tbody id="itemsBody"><tr><td colspan="8" class="small">No purchase items yet.</td></tr></tbody>
      </table>
    </div>

    <div class="summary">
      <div class="srow"><span>Subtotal</span><strong id="subtotal">0.00</strong></div>
      <div class="srow"><span>Discount</span><span><input id="discount" type="number" min="0" step="0.01" value="0" oninput="renderItems()" style="width:130px;text-align:right"></span></div>
      <div class="srow total"><span>Grand Total</span><span id="grandTotal">0.00</span></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Note</div>
    <textarea id="note" placeholder="Optional Purchase note..."></textarea>
    <div class="actions">
      <button class="secondary" onclick="resetPurchase()">Clear</button>
      <button class="primary" id="saveBtn" onclick="savePurchase()">Complete Purchase</button>
    </div>
  </div>
</div>

<script>
const MASTER_DATABASE_API_URL = "https://script.google.com/macros/s/AKfycbzIjs-cNehMxWTZs3ZPAosseGUu1nqACTPo3S4-onLLEYnEgqP6AUK7p3jwb6MaFr7H0w/exec";
const STAFF_DATABASE_API_URL = "https://script.google.com/macros/s/AKfycbwKqgTPzesBlWlk5NFelkZR-9HOzDGdukcPc49dTDtADRdLz-Bv2uABMiuajh0mpEOA/exec";

/* Paste the new Purchase Database /exec URL here after you deploy BIG_BROTHER_PURCHASE_DATABASE_V1.gs */
const PURCHASE_DATABASE_API_URL = "PASTE_PURCHASE_DATABASE_WEB_APP_URL_HERE";

let clients = [];
let catalog = [];
let staff = [];
let items = [];

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function money(n){return Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function setStatus(msg,type=""){const el=document.getElementById("status");el.textContent=msg;el.className="status"+(type?" "+type:"");}
function purchaseApiReady(){return PURCHASE_DATABASE_API_URL.startsWith("https://script.google.com/");}

async function getJson(url,params={}){
  const u=new URL(url);
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u);
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}
function arrayOf(res){if(Array.isArray(res))return res;if(Array.isArray(res?.data))return res.data;return [];}
function postForm(url,action,fieldName,data){
  return new Promise((resolve,reject)=>{
    const name="bb_purchase_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const iframe=document.createElement("iframe");iframe.name=name;iframe.style.display="none";document.body.appendChild(iframe);
    const form=document.createElement("form");form.method="POST";form.action=url;form.target=name;form.style.display="none";
    const a=document.createElement("input");a.type="hidden";a.name="action";a.value=action;form.appendChild(a);
    const d=document.createElement("input");d.type="hidden";d.name=fieldName;d.value=JSON.stringify(data);form.appendChild(d);
    document.body.appendChild(form);
    try{form.submit();}catch(e){form.remove();iframe.remove();reject(e);return;}
    setTimeout(()=>{form.remove();iframe.remove();resolve({success:true});},2200);
  });
}

async function loadMasterData(){
  try{
    const [c,s] = await Promise.all([
      getJson(MASTER_DATABASE_API_URL,{action:"getClients"}),
      getJson(STAFF_DATABASE_API_URL,{action:"getStaff",includeInactive:"false"})
    ]);

    clients=arrayOf(c);
    staff=arrayOf(s);

    document.getElementById("client").innerHTML =
      '<option value="">Select Client / Supplier</option>'+
      clients.map((x,i)=>`<option value="${i}">${esc(x.clientName)}${x.clientCode?` — ${esc(x.clientCode)}`:""}</option>`).join("");

    let purchasers=staff.filter(x=>String(x.position||"").toLowerCase().includes("purchas"));
    if(!purchasers.length)purchasers=staff;

    document.getElementById("purchaser").innerHTML =
      '<option value="">Select Purchaser</option>'+
      purchasers.map(x=>`<option value="${esc(x.staffId)}" data-name="${esc(x.staffName)}">${esc(x.staffName)} — ${esc(x.staffId)}</option>`).join("");

  }catch(e){
    console.error(e);
    setStatus("Could not load Client / Staff Master Data. Deploy Master Database V6 first.");
  }
}

async function clientChanged(){
  const index=Number(document.getElementById("client").value);
  const c=Number.isInteger(index)&&clients[index]?clients[index]:null;

  items=[];
  renderItems();

  document.getElementById("clientCode").value=c?.clientCode||"";
  document.getElementById("paymentTerm").value=c?.paymentTerm||"";
  document.getElementById("currency").value=c?.currency||"USD";

  if(!c){
    catalog=[];
    fillProducts();
    return;
  }

  setStatus("Loading products and current prices for "+c.clientName+"...");

  try{
    const res=await getJson(MASTER_DATABASE_API_URL,{
      action:"getPurchaseClientCatalog",
      clientId:c.clientId
    });
    catalog=arrayOf(res);
    fillProducts();
    setStatus(catalog.length+" product(s) loaded for "+c.clientName+".","success");
  }catch(e){
    catalog=[];
    fillProducts();
    setStatus("Could not load Client Products / Prices.");
  }
}

function fillProducts(){
  const el=document.getElementById("product");
  el.innerHTML='<option value="">Select Product</option>'+
    catalog.map((x,i)=>`<option value="${i}">${esc(x.productName)} — ${esc(x.productCode)}</option>`).join("");
  document.getElementById("qty").value="";
  document.getElementById("price").value="";
  document.getElementById("unit").value="";
}

document.addEventListener("change",e=>{
  if(e.target?.id!=="product")return;
  const i=Number(e.target.value);
  const p=Number.isInteger(i)&&catalog[i]?catalog[i]:null;
  document.getElementById("price").value=p?Number(p.purchasePrice||0):"";
  document.getElementById("unit").value=p?.unit||"";
  document.getElementById("qty").focus();
});

function syncPurchaser(){
  document.getElementById("purchaserId").value=document.getElementById("purchaser").value||"";
}

function addItem(){
  const i=Number(document.getElementById("product").value);
  const p=Number.isInteger(i)&&catalog[i]?catalog[i]:null;
  const qty=Number(document.getElementById("qty").value)||0;
  const price=Number(document.getElementById("price").value)||0;

  if(!p)return alert("Select a Product.");
  if(qty<=0)return alert("Qty must be greater than 0.");

  items.push({
    productCode:p.productCode,
    productName:p.productName,
    qty:qty,
    unit:p.unit||"",
    unitPrice:price
  });

  document.getElementById("product").value="";
  document.getElementById("qty").value="";
  document.getElementById("price").value="";
  document.getElementById("unit").value="";
  renderItems();
}

function removeItem(index){items.splice(index,1);renderItems();}

function renderItems(){
  const body=document.getElementById("itemsBody");
  if(!items.length){
    body.innerHTML='<tr><td colspan="8" class="small">No purchase items yet.</td></tr>';
  } else {
    body.innerHTML=items.map((x,i)=>`
      <tr>
        <td>${i+1}</td>
        <td><strong>${esc(x.productName)}</strong></td>
        <td>${esc(x.productCode)}</td>
        <td>${money(x.qty)}</td>
        <td>${esc(x.unit)}</td>
        <td>${money(x.unitPrice)}</td>
        <td><strong>${money(x.qty*x.unitPrice)}</strong></td>
        <td><button class="danger" onclick="removeItem(${i})">Delete</button></td>
      </tr>`).join("");
  }

  const subtotal=items.reduce((sum,x)=>sum+(Number(x.qty)||0)*(Number(x.unitPrice)||0),0);
  const discount=Math.min(subtotal,Math.max(0,Number(document.getElementById("discount").value)||0));
  const total=Math.max(0,subtotal-discount);

  document.getElementById("subtotal").textContent=money(subtotal);
  document.getElementById("grandTotal").textContent=money(total);
}

async function loadNextPurchaseId(){
  if(!purchaseApiReady()){
    document.getElementById("purchaseId").value="";
    return;
  }
  try{
    const res=await getJson(PURCHASE_DATABASE_API_URL,{action:"getNextPurchaseId"});
    document.getElementById("purchaseId").value=res.purchaseId||"";
  }catch(e){}
}

async function savePurchase(){
  if(!purchaseApiReady()){
    alert("Deploy the Purchase Database first, then paste its /exec URL into PURCHASE_DATABASE_API_URL.");
    return;
  }

  const ci=Number(document.getElementById("client").value);
  const client=Number.isInteger(ci)&&clients[ci]?clients[ci]:null;
  const purchaserEl=document.getElementById("purchaser");
  const purchaserName=purchaserEl.options[purchaserEl.selectedIndex]?.dataset?.name||"";

  if(!client)return alert("Select a Client / Supplier.");
  if(!items.length)return alert("Add at least one product.");
  if(!purchaserEl.value)return alert("Select Purchaser.");

  const data={
    purchaseId:document.getElementById("purchaseId").value,
    purchaseDate:document.getElementById("purchaseDate").value,
    clientId:client.clientId,
    clientName:client.clientName,
    clientCode:client.clientCode||"",
    currency:document.getElementById("currency").value||"USD",
    paymentTerm:client.paymentTerm||"",
    purchaserStaffId:purchaserEl.value,
    purchaserName:purchaserName,
    discount:Number(document.getElementById("discount").value)||0,
    note:document.getElementById("note").value.trim(),
    items:items
  };

  const total=items.reduce((sum,x)=>sum+x.qty*x.unitPrice,0)-Math.max(0,Number(data.discount)||0);

  if(!confirm("Complete this Purchase?\n\nClient: "+client.clientName+"\nItems: "+items.length+"\nTotal: "+money(Math.max(0,total))+" "+data.currency))return;

  const btn=document.getElementById("saveBtn");
  btn.disabled=true;
  btn.textContent="Saving...";

  try{
    await postForm(PURCHASE_DATABASE_API_URL,"savePurchase","purchaseData",data);
    setStatus("Purchase sent successfully. Purchase ID: "+(data.purchaseId||"generated by database"),"success");
    alert("Purchase completed successfully.");
    resetPurchase();
  }catch(e){
    alert("Could not save Purchase. "+(e.message||""));
  }finally{
    btn.disabled=false;
    btn.textContent="Complete Purchase";
  }
}

function resetPurchase(){
  items=[];
  catalog=[];
  document.getElementById("client").value="";
  document.getElementById("clientCode").value="";
  document.getElementById("paymentTerm").value="";
  document.getElementById("currency").value="USD";
  document.getElementById("product").innerHTML='<option value="">Select Product</option>';
  document.getElementById("qty").value="";
  document.getElementById("price").value="";
  document.getElementById("unit").value="";
  document.getElementById("discount").value="0";
  document.getElementById("note").value="";
  document.getElementById("purchaseDate").value=today();
  renderItems();
  loadNextPurchaseId();
  setStatus("Select a Client / Supplier. The system will load only the products that this client sells.");
}

document.getElementById("purchaseDate").value=today();
loadMasterData();
loadNextPurchaseId();
renderItems();
</script>
</body>
</html>
